name: CI

on:
  push:
    branches: [master, development]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Node ${{ matrix.node }} / NestJS ${{ matrix.nest }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.x", "24.x"]
        nest: ["10", "11"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # devDependencies pin NestJS 11; swap in 10 to check the other peer range.
      - name: Install NestJS ${{ matrix.nest }}
        if: matrix.nest != '11'
        run: npm install --no-save @nestjs/common@^${{ matrix.nest }} @nestjs/core@^${{ matrix.nest }} @nestjs/microservices@^${{ matrix.nest }}
      - run: npm test
