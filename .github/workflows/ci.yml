name: CI

on:
  push:
    branches: [master, development]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Node ${{ matrix.node }} / NestJS ${{ matrix.nest }} / service-bus ${{ matrix.service-bus }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.x", "24.x"]
        nest: ["10", "11"]
        # Lowest version of the peer range, and the latest release.
        service-bus: ["7.9.0", "latest"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # One install: a second `npm install --no-save` would undo the first.
      - name: Install NestJS ${{ matrix.nest }} and @azure/service-bus ${{ matrix.service-bus }}
        run: npm install --no-save "@azure/service-bus@$SERVICE_BUS" $NEST
        env:
          SERVICE_BUS: ${{ matrix.service-bus }}
          # devDependencies pin NestJS 11; swap in 10 to check the other peer range.
          NEST: ${{ matrix.nest != '11' && format('@nestjs/common@^{0} @nestjs/core@^{0} @nestjs/microservices@^{0}', matrix.nest) || '' }}
      # npm test compiles against the installed versions, then runs the tests.
      - run: npm test
      # Fails if the package would publish tests, CI files, the emulator
      # setup or configs, or source maps pointing to unpublished files.
      - run: npm run check:pack

  integration:
    name: Emulator / NestJS ${{ matrix.nest }} / service-bus ${{ matrix.service-bus }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        nest: ["10", "11"]
        # 7.9.5 is the first release that can connect to the emulator
        # (UseDevelopmentEmulator); the unit tests cover 7.9.0.
        service-bus: ["7.9.5", "latest"]
    env:
      # LICENSES: ACCEPT_EULA=Y accepts, for this run, the Microsoft license
      # terms of the Azure Service Bus emulator
      # (https://github.com/Azure/azure-service-bus-emulator-installer/blob/main/EMULATOR_EULA.txt)
      # and of SQL Server for Linux (https://go.microsoft.com/fwlink/?LinkId=746388).
      # Whoever runs or enables this job accepts those terms.
      ACCEPT_EULA: "Y"
      # Fail instead of skipping when the emulator is not reachable.
      SB_EMULATOR_REQUIRED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.x"
          cache: npm
      - name: Start the Service Bus emulator
        run: |
          # Throwaway password for the emulator's local SQL Server.
          MSSQL_SA_PASSWORD="Sb1-$(openssl rand -hex 16)"
          echo "::add-mask::$MSSQL_SA_PASSWORD"
          echo "MSSQL_SA_PASSWORD=$MSSQL_SA_PASSWORD" >> "$GITHUB_ENV"
          export MSSQL_SA_PASSWORD
          docker compose -f test/integration/docker-compose.yml up -d
      - run: npm ci
      - name: Install NestJS ${{ matrix.nest }} and @azure/service-bus ${{ matrix.service-bus }}
        run: npm install --no-save "@azure/service-bus@$SERVICE_BUS" $NEST
        env:
          SERVICE_BUS: ${{ matrix.service-bus }}
          NEST: ${{ matrix.nest != '11' && format('@nestjs/common@^{0} @nestjs/core@^{0} @nestjs/microservices@^{0}', matrix.nest) || '' }}
      - name: Wait for the emulator
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5300/health | grep -q '"healthy"'; then exit 0; fi
            sleep 3
          done
          docker compose -f test/integration/docker-compose.yml logs
          exit 1
      - run: npm run test:integration
      - name: Emulator logs
        if: failure()
        run: docker compose -f test/integration/docker-compose.yml logs
      - name: Stop the emulator
        if: always()
        run: docker compose -f test/integration/docker-compose.yml down -v
