# Azure Service Bus emulator for the optional integration tests
# (`npm run test:integration`). Based on Microsoft's documented setup:
# https://learn.microsoft.com/azure/service-bus-messaging/test-locally-with-service-bus-emulator
#
# LICENSES: this file does not accept anything on your behalf. Both containers
# start only if you set ACCEPT_EULA=Y yourself, and by doing so YOU accept the
# Microsoft license terms of:
#   - the Service Bus emulator:
#     https://github.com/Azure/azure-service-bus-emulator-installer/blob/main/EMULATOR_EULA.txt
#   - SQL Server for Linux (the emulator's storage):
#     https://go.microsoft.com/fwlink/?LinkId=746388
#
# Usage (from the repository root):
#   export ACCEPT_EULA=Y                      # only if you accept the terms above
#   export MSSQL_SA_PASSWORD='<8+ chars, 3 of: upper, lower, digit, symbol>'
#   docker compose -f test/integration/docker-compose.yml up -d --wait
#   npm run test:integration
#   docker compose -f test/integration/docker-compose.yml down -v
#
# SQL Server is published for amd64 only. On arm64 hosts (Apple silicon) it
# runs under Docker's amd64 emulation, which is Microsoft's documented way to
# run SQL Server containers on macOS for development. The emulator image is
# multi-arch and runs natively.
name: nestjs-service-bus-itest
services:
  emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:2.0.1
    volumes:
      - "./emulator/Config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro"
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:5300:5300"
    environment:
      SQL_SERVER: mssql
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD}"
      ACCEPT_EULA: "${ACCEPT_EULA:?set ACCEPT_EULA=Y to accept the Microsoft license terms listed above}"
      EMULATOR_HTTP_PORT: "5300"
      SQL_WAIT_INTERVAL: "${SQL_WAIT_INTERVAL:-15}"
    depends_on:
      - mssql
    healthcheck:
      # The image is distroless (no shell, no curl), so the health endpoint is
      # polled from the host by the test helper instead. See helpers.js.
      disable: true
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "${ACCEPT_EULA:?set ACCEPT_EULA=Y to accept the Microsoft license terms listed above}"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD}"
